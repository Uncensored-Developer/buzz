name: CI Pipeline
on: [push]

jobs:
    build:
        runs-on: self-hosted

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.22.7

            - name: Build
              run: go build

            - name: Test
              run: go test -v ./...
